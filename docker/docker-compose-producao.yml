version: "3.8"

services:
  # ==========================================
  # SERVIÇO BACKEND (FastAPI - Nexus Chat API)
  # ==========================================
  nexus-chat-backend:
    image: ${IMAGE_BACKEND:-aryalvesfernandes/nexus-chat:backend-1.0.0}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      network_swarm_public:
        aliases:
          - backend
          - nexus-chat-backend
          - nexus_chat_backend

    volumes:
      - nexus_chat_uploads:/app/uploads
      - nexus_chat_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - PORT=
      - TZ=
      - PROJECT_NAME=
      - API_V1_STR=
      - ENABLE_SCHEDULER=
      - DATABASE_URL=
      - DB_POOL_SIZE=
      - DB_MAX_OVERFLOW=
      - REDIS_URL=
      - SECRET_KEY=
      - ACCESS_TOKEN_EXPIRE_MINUTES=
      - ENCRYPTION_KEY=
      - PASSWORD_PEPPER=
      - SECURITY_PASSWORD_PEPPER=
      - SUPERADMIN_NAME=
      - SUPERADMIN_EMAIL=
      - SUPERADMIN_PASSWORD=
      - VITE_API_URL=
      - VITE_WS_URL=
      - CORS_ORIGINS=
      - RATE_LIMIT_ENABLED=
      - BREVO_API_KEY=
      - BREVO_SENDER_EMAIL=
      - BREVO_SENDER_NAME=
      - LIVEKIT_URL=
      - LIVEKIT_API_KEY=
      - LIVEKIT_API_SECRET=
      - LIVEKIT_KEYS=
      # === Backblaze B2 (Armazenamento de Mídias e Backups) ===
      - BACKBLAZE_ENDPOINT_URL=
      - BACKBLAZE_KEY_ID=
      - BACKBLAZE_APPLICATION_KEY=
      - BACKBLAZE_BUCKET_NAME=
      - BACKBLAZE_CDN_URL=
      - B2_FOLDER=
      - B2_MEDIA_FOLDER=
      - B2_RETENTION_MAX=

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.nexus-chat-backend.rule=Host(`${API_DOMAIN:-api.seu-dominio.com}`)
        - traefik.http.routers.nexus-chat-backend.entrypoints=websecure
        - traefik.http.routers.nexus-chat-backend.tls=true
        - traefik.http.routers.nexus-chat-backend.tls.certresolver=letsencryptresolver
        - traefik.http.services.nexus-chat-backend.loadbalancer.server.port=8000

  # ==========================================
  # SERVIÇO FRONTEND (React SPA + Nginx - Nexus Chat Web)
  # ==========================================
  nexus-chat-frontend:
    image: ${IMAGE_FRONTEND:-aryalvesfernandes/nexus-chat:frontend-1.0.0}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public

    volumes:
      - nexus_chat_logs:/var/log/nginx
    environment:
      - PORT=
      - TZ=
      - PROJECT_NAME=
      - API_V1_STR=
      - ENABLE_SCHEDULER=
      - DATABASE_URL=
      - DB_POOL_SIZE=
      - DB_MAX_OVERFLOW=
      - REDIS_URL=
      - SECRET_KEY=
      - ACCESS_TOKEN_EXPIRE_MINUTES=
      - ENCRYPTION_KEY=
      - PASSWORD_PEPPER=
      - SECURITY_PASSWORD_PEPPER=
      - SUPERADMIN_NAME=
      - SUPERADMIN_EMAIL=
      - SUPERADMIN_PASSWORD=
      - VITE_API_URL=
      - VITE_WS_URL=
      - CORS_ORIGINS=
      - RATE_LIMIT_ENABLED=
      - BREVO_API_KEY=
      - BREVO_SENDER_EMAIL=
      - BREVO_SENDER_NAME=
      - LIVEKIT_URL=
      - LIVEKIT_API_KEY=
      - LIVEKIT_API_SECRET=
      - LIVEKIT_KEYS=
      # === Backblaze B2 (Armazenamento de Mídias e Backups) ===
      - BACKBLAZE_ENDPOINT_URL=
      - BACKBLAZE_KEY_ID=
      - BACKBLAZE_APPLICATION_KEY=
      - BACKBLAZE_BUCKET_NAME=
      - BACKBLAZE_CDN_URL=
      - B2_FOLDER=
      - B2_MEDIA_FOLDER=
      - B2_RETENTION_MAX=

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.nexus-chat-frontend.rule=Host(`${DOMAIN:-seu-dominio.com}`)
        - traefik.http.routers.nexus-chat-frontend.entrypoints=websecure
        - traefik.http.routers.nexus-chat-frontend.tls=true
        - traefik.http.routers.nexus-chat-frontend.tls.certresolver=letsencryptresolver
        - traefik.http.services.nexus-chat-frontend.loadbalancer.server.port=80

  # ==========================================
  # SERVIÇO LIVEKIT SFU (Canais de Voz e Vídeo)
  # ==========================================
  nexus-chat-livekit:
    image: ${IMAGE_LIVEKIT:-livekit/livekit-server:latest}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      network_swarm_public:
        aliases:
          - livekit
          - nexus-chat-livekit
          - nexus_chat_livekit

    volumes:
      - nexus_chat_livekit_config:/etc/livekit
      - nexus_chat_logs:/var/log/livekit
    command: --config /etc/livekit.yaml
    ports:
      - target: 7880
        published: 7880
        protocol: tcp
        mode: host
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
    environment:
      - PORT=
      - TZ=
      - PROJECT_NAME=
      - API_V1_STR=
      - ENABLE_SCHEDULER=
      - DATABASE_URL=
      - DB_POOL_SIZE=
      - DB_MAX_OVERFLOW=
      - REDIS_URL=
      - SECRET_KEY=
      - ACCESS_TOKEN_EXPIRE_MINUTES=
      - ENCRYPTION_KEY=
      - PASSWORD_PEPPER=
      - SECURITY_PASSWORD_PEPPER=
      - SUPERADMIN_NAME=
      - SUPERADMIN_EMAIL=
      - SUPERADMIN_PASSWORD=
      - VITE_API_URL=
      - VITE_WS_URL=
      - CORS_ORIGINS=
      - RATE_LIMIT_ENABLED=
      - BREVO_API_KEY=
      - BREVO_SENDER_EMAIL=
      - BREVO_SENDER_NAME=
      - LIVEKIT_URL=
      - LIVEKIT_API_KEY=
      - LIVEKIT_API_SECRET=
      - LIVEKIT_KEYS=
      # === Backblaze B2 (Armazenamento de Mídias e Backups) ===
      - BACKBLAZE_ENDPOINT_URL=
      - BACKBLAZE_KEY_ID=
      - BACKBLAZE_APPLICATION_KEY=
      - BACKBLAZE_BUCKET_NAME=
      - BACKBLAZE_CDN_URL=
      - B2_FOLDER=
      - B2_MEDIA_FOLDER=
      - B2_RETENTION_MAX=

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.nexus-chat-livekit.rule=Host(`${LIVEKIT_DOMAIN:-livekit.${DOMAIN:-seu-dominio.com}}`)
        - traefik.http.routers.nexus-chat-livekit.entrypoints=websecure
        - traefik.http.routers.nexus-chat-livekit.tls=true
        - traefik.http.routers.nexus-chat-livekit.tls.certresolver=letsencryptresolver
        - traefik.http.services.nexus-chat-livekit.loadbalancer.server.port=7880

# ==========================================
# VOLUMES E REDES
# ==========================================
volumes:
  nexus_chat_uploads:
    name: nexus_chat_uploads
  nexus_chat_logs:
    name: nexus_chat_logs
  nexus_chat_livekit_config:
    name: nexus_chat_livekit_config

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
