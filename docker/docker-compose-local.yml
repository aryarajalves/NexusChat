name: projeto-base

services:
  db:
    image: postgres:16-alpine
    container_name: projeto_base_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      DB_NAME: projetobase
      POSTGRES_DB: projetobase
    ports:
      - "5731:5432"
    volumes:
      - projeto_base_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: projeto_base_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - projeto_base_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: projeto_base_pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: projetobase
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      ADMIN_USERS: postgres
    ports:
      - "6432:5432"

  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: projeto_base_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_KEYS=devkey: secret_livekit_key_2026_discord_clone

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: projeto_base_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/.env
    ports:
      - "8035:8000"
    volumes:
      - ../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: projeto_base_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3005:80"

volumes:
  projeto_base_pg_data:
  projeto_base_redis_data:
